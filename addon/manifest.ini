name = sunetLaDistanta
summary = "Sunet la distanță"
description = """Aduce sunetul calculatorului controlat prin Remote-ul inclus în NVDA: muzica, videoclipurile, sunetele Windows și ale programelor, nu doar vocea NVDA. Se instalează pe ambele calculatoare. NVDA+Control+Shift+S pornește sau oprește sunetul, NVDA+Control+Shift+plus sau minus schimbă volumul. Din Setări NVDA, categoria Sunet la distanță, alegi dacă sunetul pornește automat odată cu Remote-ul (implicit da)."""
author = "Răzvan"
version = 0.2.0
minimumNVDAVersion = 2026.1.0
lastTestedNVDAVersion = 2026.3.0
