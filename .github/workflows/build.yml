name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VER: 0.3.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Addonul
        run: |

          sed -i "s/^version = .*/version = $VER/" addon/manifest.ini
          python3 -m compileall -q addon
          find addon -name __pycache__ -prune -exec rm -rf {} +
          (cd addon && zip -qr "../sunetLaDistanta.nvda-addon" .)
          printf "%s" "$VER" > version.txt
      - name: Publicare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "sunetLaDistanta.nvda-addon" version.txt --title "Sunet la distanță $VER" --notes "Versiunea $VER. Apasă Enter pe sunetLaDistanta.nvda-addon ca să-l instalezi; după aceea se actualizează singur la pornirea NVDA."
